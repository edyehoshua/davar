name: Mobile CI

on:
  push:
    branches: [main, apocalipsis]
    paths: ["mobile/**", "shared/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    branches: [main, apocalipsis]
    paths: ["mobile/**", "shared/**", ".github/workflows/mobile-ci.yml"]

permissions:
  contents: read
  deployments: write

jobs:
  mobile_ci:
    name: mobile-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create development deployment
        id: create_deployment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: 'development',
              description: `Mobile PR #${prNumber} validation`,
              required_contexts: [],
              auto_merge: false,
              transient_environment: true,
              production_environment: false,
              payload: JSON.stringify({ app: 'mobile', pr: prNumber }),
            });
            core.setOutput('deployment_id', String(data.id));

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd mobile
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "bun install attempt $attempt/$max_attempts"
            if bun install --frozen-lockfile; then
              echo "bun install succeeded"
              break
            fi

            echo "bun install failed on attempt $attempt"
            echo "Clearing Bun cache before retry"
            rm -rf ~/.bun/install/cache

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "bun install failed after $max_attempts attempts"
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 3
          done

      - name: Run lint
        run: |
          cd mobile
          bun run lint

      - name: Run service regression tests
        run: |
          cd mobile
          bun test src/services/*.test.ts

      - name: Check TypeScript
        run: |
          cd mobile
          bun run typecheck

      - name: Finalize development deployment
        if: always() && github.event_name == 'pull_request' && steps.create_deployment.outputs.deployment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ steps.create_deployment.outputs.deployment_id }}');
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Mobile PR checks passed' : 'Mobile PR checks failed',
            });

name: Hutter transcription QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/hutter/**'
      - 'tests/test_hutter_transcription.py'
      - 'data/hutter/**'
      - '.github/workflows/hutter-transcription-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/hutter/**'
      - 'tests/test_hutter_transcription.py'
      - 'data/hutter/**'
      - '.github/workflows/hutter-transcription-ci.yml'
permissions:
  contents: read
jobs:
  transcription:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_hutter_transcription.py
